<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <meta name="theme-color" content="#3E9FE0">
    <!-- "Thêm vào MH chính" opens the game without browser bars: the only full screen iPhone has -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="{{{ PRODUCT_NAME }}}">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="manifest" href="TemplateData/manifest.webmanifest">
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loading">
        <img id="loading-icon" src="TemplateData/icon.png" alt="">
        <div id="loading-title">{{{ PRODUCT_NAME }}}</div>
        <div id="bar"><div id="bar-fill"></div></div>
        <div id="loading-note">Đang tải nông trại…</div>
      </div>

      <!-- phones: offered once the game has loaded (a tap is required to go full screen) -->
      <div id="fs-prompt" hidden>
        <div class="fs-card">
          <div class="fs-glyph" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <div class="fs-title">Chơi toàn màn hình</div>
          <div class="fs-text">Ẩn thanh trình duyệt để nông trại rộng hết màn hình.</div>
          <button id="fs-go" type="button">Toàn màn hình</button>
          <button id="fs-later" type="button" class="fs-link">Để sau</button>
        </div>
      </div>

      <!-- iPhone Safari has no page full screen: explain the home-screen icon instead, once -->
      <div id="ios-hint" hidden>
        <div class="fs-card">
          <div class="fs-title">Chơi toàn màn hình trên iPhone</div>
          <div class="fs-text">Chạm nút <b>Chia sẻ</b> của Safari rồi chọn <b>Thêm vào MH chính</b>.
            Mở game từ biểu tượng đó sẽ không còn thanh trình duyệt.</div>
          <button id="ios-ok" type="button">Đã hiểu</button>
        </div>
      </div>

      <div id="rotate">
        <div class="rotate-phone"></div>
        <div>Xoay ngang điện thoại để chơi</div>
      </div>

      <div id="error" hidden></div>
    </div>

    <script>
      // ---- full screen, shared by the card below and the in-game button (Plugins/WebGL/MatuFullscreen.jslib) ----
      window.MatuFullscreen = (function () {
        var doc = document, root = document.documentElement;
        var retryArmed = false;

        function request() { return root.requestFullscreen || root.webkitRequestFullscreen; }
        function available() {
          return !!request() && doc.fullscreenEnabled !== false && doc.webkitFullscreenEnabled !== false;
        }
        function isOn() { return !!(doc.fullscreenElement || doc.webkitFullscreenElement); }
        function standalone() {
          try {
            return window.matchMedia("(display-mode: fullscreen)").matches ||
                   window.matchMedia("(display-mode: standalone)").matches ||
                   window.navigator.standalone === true;
          } catch (e) { return false; }
        }
        function lockLandscape() {
          try {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
          } catch (e) {}
        }
        // A request made outside a recent tap is refused; try once more on the next tap anywhere.
        function retryOnNextTap() {
          if (retryArmed) return;
          retryArmed = true;
          var once = function () {
            doc.removeEventListener("pointerup", once, true);
            doc.removeEventListener("touchend", once, true);
            retryArmed = false;
            if (!isOn()) enter(true);
          };
          doc.addEventListener("pointerup", once, true);
          doc.addEventListener("touchend", once, true);
        }
        function enter(isRetry) {
          var req = request();
          if (!req || isOn()) return;
          try {
            var p = req.call(root, { navigationUI: "hide" });
            if (p && p.then) p.then(lockLandscape).catch(function () { if (!isRetry) retryOnNextTap(); });
            else lockLandscape();
          } catch (e) { if (!isRetry) retryOnNextTap(); }
        }
        function exit() {
          var ex = doc.exitFullscreen || doc.webkitExitFullscreen;
          if (!ex || !isOn()) return;
          try { var p = ex.call(doc); if (p && p.catch) p.catch(function () {}); } catch (e) {}
        }
        return {
          available: available, isOn: isOn, standalone: standalone,
          enter: function () { enter(false); }, exit: exit,
          toggle: function () { if (isOn()) exit(); else enter(false); },
        };
      })();

      var canvas = document.querySelector("#unity-canvas");
      var errorBox = document.querySelector("#error");

      function showBanner(msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        errorBox.textContent = msg;
        errorBox.hidden = false;
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // The farm is saved to Application.persistentDataPath (lqfarm.save.json). Without this the
        // file lives only in memory and a page reload starts a new farm.
        autoSyncPersistentDataPath: true,
      };

      // Phones: render at most 2x — a 3x canvas of a UI-heavy scene costs more than it shows.
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);   // iPadOS reports a Mac
      var isIPhone = /iPhone|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        document.body.classList.add("mobile");
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      function remembered(key) { try { return localStorage.getItem(key) === "1"; } catch (e) { return false; } }
      function remember(key) { try { localStorage.setItem(key, "1"); } catch (e) {} }

      // After loading, on a phone that is still inside the browser: offer full screen once per visit,
      // or on iPhone explain the home-screen icon (once, ever). Desktop has the in-game button.
      function offerFullscreen() {
        var fs = window.MatuFullscreen;
        if (!isMobile || fs.standalone() || fs.isOn()) return;
        if (fs.available()) {
          var card = document.querySelector("#fs-prompt");
          card.hidden = false;
          document.querySelector("#fs-go").onclick = function () { card.hidden = true; fs.enter(); canvas.focus(); };
          document.querySelector("#fs-later").onclick = function () { card.hidden = true; canvas.focus(); };
        } else if (isIPhone && !remembered("matu.iosFullscreenHint")) {
          var hint = document.querySelector("#ios-hint");
          hint.hidden = false;
          document.querySelector("#ios-ok").onclick = function () { hint.hidden = true; remember("matu.iosFullscreenHint"); canvas.focus(); };
        }
      }

      document.querySelector("#loading").style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = Math.round(100 * progress) + "%";
          if (progress >= 0.9) document.querySelector("#loading-note").textContent = "Sắp xong rồi…";
        }).then(function (unityInstance) {
          var loading = document.querySelector("#loading");
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; offerFullscreen(); }, 450);
        }).catch(function (message) {
          showBanner("Không tải được game: " + message, "error");
        });
      };
      script.onerror = function () { showBanner("Không tải được game. Kiểm tra mạng rồi tải lại trang.", "error"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
